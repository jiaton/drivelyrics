[project]
name = "lyric-backend"
version = "0.1.0"
description = "Now-playing lyrics service: polls Spotify, matches synced lyrics, streams to the frontend"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "fastapi (>=0.115,<1.0)",
    "uvicorn[standard] (>=0.32,<1.0)",
    "httpx (>=0.27,<1.0)",
    "sqlmodel (>=0.0.22,<1.0)",
    "pydantic-settings (>=2.6,<3.0)",
    "sse-starlette (>=2.1,<3.0)",
    "opencc (>=1.1,<2.0)",
    "cryptography (>=43,<47)",
    "segno (>=1.6,<2.0)",
]

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
