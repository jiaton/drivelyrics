  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- lyric lines: the one being sung is lit, like the app's scrolling view -->
  <rect x="146" y="150" width="220" height="40" rx="20" fill="#ffffff" opacity="0.28"/>
  <rect x="96" y="236" width="320" height="52" rx="26" fill="url(#hl)"/>
  <rect x="166" y="334" width="180" height="40" rx="20" fill="#ffffff" opacity="0.28"/>
