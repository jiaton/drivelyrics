events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  upstream backend {
    server backend:8000;
  }

  server {
    listen 80;

    # SSE stream: no buffering, no chunked-response batching, no timeout cutoff.
    location ^~ /api/spotify/now-playing/stream {
      proxy_pass http://backend/api/spotify/now-playing/stream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1d;
    }

    # ^~: API paths never reach the regex location below.
    location ^~ /api/ {
      proxy_pass http://backend/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
      proxy_pass http://backend/health;
    }

    # Probes for files the app doesn't have (/wp-admin/install.php, /.env, /.git/config,
    # /cgi-bin/…) get a real 404 instead of the app's page. App routes have no extension
    # and never start with a dot; real files (icons, assets) are still served.
    location ~ (^/\.|^/(wp-|cgi-bin|phpmyadmin|vendor/)|\.[A-Za-z0-9]+$) {
      root /usr/share/nginx/html;
      try_files $uri =404;
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri /index.html;
    }
  }
}
